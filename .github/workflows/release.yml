name: Release

# Triggered by pushing a v*.*.* tag. Builds the card from source and
# attaches everything in dist/ to a GitHub Release — creating the
# release on the fly if a `gh release create` hasn't already been run
# for the tag. (No .gz sidecar: HACS downloads EVERY release asset
# into the user's www/community/, so extra files are junk there.)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Check tag matches package.json version
        # A v0.3.0 tag on a 0.2.9 tree would publish a release whose
        # HACS version and bundle content disagree.
        run: |
          PKG="v$(jq -r .version package.json)"
          if [[ "$PKG" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME != package.json version $PKG — bump package.json (and the ASSET_BASE pins) before tagging."
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Drop source maps from the release bundle
        # Sourcemaps are useful at dev time but leak source structure
        # and double the ship size; they're not part of the release.
        run: rm -f dist/*.map

      - name: Show artifact inventory
        run: ls -lh dist/

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # All shippable artifacts: JS bundle,
          # GeoJSON overlays, and every monthly Blue/Black Marble
          # image. HACS copies whatever sits next to the named JS
          # file, so the imagery has to land here too — otherwise
          # the card renders with broken <image> elements after
          # install.
          mapfile -t ASSETS < <(find dist -type f -print | sort)
          echo "Uploading ${#ASSETS[@]} assets:"
          printf '  %s\n' "${ASSETS[@]}"
          # SemVer pre-release tags contain a hyphen after the version
          # (e.g. v0.1.1-alpha, v0.2.0-rc.1). Mark those as
          # prereleases on GitHub so HACS doesn't auto-promote them.
          PRE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRE_FLAG="--prerelease"
            echo "Tag $TAG looks like a pre-release"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — attaching/updating assets"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Release $TAG not found — creating with auto-notes"
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              $PRE_FLAG \
              "${ASSETS[@]}"
          fi
