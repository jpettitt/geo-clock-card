name: CI

# Tests + build on pull requests. Without this, the first time a
# branch's tests run is inside the deploy job — after the merge has
# already landed on main.

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Mirror of deploy-site.yml's gate so a forgotten pin bump
      # fails on the PR, not at deploy time on main.
      - name: Check ASSET_BASE pins match package.json
        run: |
          VERSION=$(jq -r .version package.json)
          fail=0
          for f in docs/web/index.html docs/web/wallpaper.html docs/web/sw.js; do
            if ! grep -q "'/v$VERSION'" "$f"; then
              echo "::error file=$f::ASSET_BASE does not reference /v$VERSION — bump it in lockstep with package.json"
              fail=1
            fi
          done
          exit $fail
